<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="./find.css" />
</head>
<body>
  <div class="find-bar">
    <input id="q" placeholder="Find" autofocus />
    <span class="count" id="count"></span>
    <span class="divider"></span>
    <button id="prev" title="Previous (Shift+Enter)">
      <svg viewBox="0 0 16 16" width="14" height="14"><path d="M3.5 10L8 5.5l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="next" title="Next (Enter)">
      <svg viewBox="0 0 16 16" width="14" height="14"><path d="M3.5 6L8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="close" title="Close (Esc)">
      <svg viewBox="0 0 16 16" width="13" height="13"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </div>
  <script type="module">
    import { FindBar } from './find.js'
    new FindBar()
  </script>
</body>
</html>
