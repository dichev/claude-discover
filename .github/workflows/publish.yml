name: Publish

on:
  push:
    tags: ['v*'] # pushed by `npm version <patch|minor|major> && git push --follow-tags`

permissions:
  id-token: write # npm trusted publishing (OIDC)
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # staged publishing needs npm >= 11.15.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm stage publish # goes live once you approve it on npmjs.com
